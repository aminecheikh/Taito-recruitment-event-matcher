# Render Blueprint for the hosted demo (free tier). One web service = one Node process, which the
# JSON-file store needs. Free instances sleep after 15 min idle and the disk is temporary, so the
# demo data goes back to the seed after each sleep or deploy.
services:
  - type: web
    name: taito
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Visitors must not wipe each other's data mid-judging.
      - key: DEMO_RESET_ENABLED
        value: "false"
      # mock, google, anthropic or openai. Set it and the matching key in the dashboard.
      - key: AI_PROVIDER
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
